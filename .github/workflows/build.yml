name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev build-essential ccache libltdl-dev

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.34 setuptools

      - name: Bundle pure-python libraries
        run: |
          pip install --no-deps -t /tmp/pylibs kivymd==1.2.0
          pip install -t /tmp/pylibs arabic-reshaper python-bidi==0.4.2 jdatetime six
          rm -rf /tmp/pylibs/bin /tmp/pylibs/*.dist-info /tmp/pylibs/__pycache__
          cp -r /tmp/pylibs/. .
          ls
          
      - name: Prepare patched python-for-android
        run: |
          git clone --depth 1 --branch master https://github.com/kivy/python-for-android.git /tmp/p4a
          for f in $(find /tmp/p4a/pythonforandroid/bootstraps -name AndroidManifest.tmpl.xml); do
            sed -i 's#</application>#    <receiver android:name="org.zistro.zistro.ReminderReceiver" android:exported="false" />\n    </application>#' "$f"
            echo "patched: $f"
            grep -n "ReminderReceiver" "$f"
          done
          
      - name: Restore signing key
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.DEBUG_KEYSTORE_B64 }}" | base64 -d > ~/.android/debug.keystore
      
      - name: Build APK
        run: |
          set -o pipefail
          buildozer android debug 2>&1 | tee build.log

      - name: Re-sign APK with fixed key
        run: |
          BT=$(ls -d ~/.buildozer/android/platform/android-sdk/build-tools/* | sort -V | tail -n 1)
          APK=$(ls bin/*.apk | head -n 1)
          "$BT/zipalign" -f -p 4 "$APK" /tmp/aligned.apk
          "$BT/apksigner" sign \
            --ks ~/.android/debug.keystore \
            --ks-pass pass:android --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            --out "$APK" /tmp/aligned.apk
          "$BT/apksigner" verify --print-certs "$APK" | grep "SHA-256"
          
      - name: Compare signing key
        if: always()
        continue-on-error: true
        run: |
          norm() { tr -d ':' | tr 'A-Z' 'a-z'; }
          KS=$(keytool -list -v -keystore ~/.android/debug.keystore -storepass android 2>/dev/null | grep "SHA256:" | head -n 1 | awk '{print $NF}' | norm)
          AS=$(find ~/.buildozer/android/platform/android-sdk/build-tools -name apksigner | sort | tail -n 1)
          APK=$("$AS" verify --print-certs bin/*.apk 2>/dev/null | grep "SHA-256 digest" | head -n 1 | awk '{print $NF}' | norm)
          echo "keystore sha256: $KS"
          echo "apk      sha256: $APK"
          [ "$KS" = "$APK" ] && echo "MATCH: apk is signed with the restored key" || echo "MISMATCH"
          
      - name: Find the real error
        if: failure()
        run: |
          grep -n -E "What went wrong|FAILURE:|Execution failed|Keystore|tampered|Failed to read key|error:|Exception" build.log | cut -c1-300 | tail -n 25
          echo "=== last 60 lines ==="
          tail -n 60 build.log | cut -c1-300
          
      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
     
      - name: Show signing fingerprint
        if: always()
        continue-on-error: true
        run: |
          AS=$(find ~/.buildozer/android/platform/android-sdk/build-tools -name apksigner | sort | tail -n 1)
          "$AS" verify --print-certs bin/*.apk | grep -E "DN|SHA-256"
   
      - name: Diagnose manifest
        if: always()
        continue-on-error: true
        run: |
          D=.buildozer/android/platform/build-arm64-v8a/dists/zistro
          echo "=== receiver lines ==="
          grep -n -i "receiver" $D/src/main/AndroidManifest.xml || echo "NO receiver found"
          echo "=== end of manifest ==="
          tail -n 25 $D/src/main/AndroidManifest.xml

      - name: Verify receiver in manifest
        run: |
          D=.buildozer/android/platform/build-arm64-v8a/dists/zistro
          grep -n "ReminderReceiver" $D/src/main/AndroidManifest.xml
