name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev build-essential ccache libltdl-dev

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.34 setuptools

      - name: Bundle pure-python libraries
        run: |
          pip install --no-deps -t /tmp/pylibs kivymd==1.2.0
          pip install -t /tmp/pylibs arabic-reshaper python-bidi==0.4.2 jdatetime six
          rm -rf /tmp/pylibs/bin /tmp/pylibs/*.dist-info /tmp/pylibs/__pycache__
          cp -r /tmp/pylibs/. .
          ls
          
      - name: Prepare patched python-for-android
        run: |
          git clone --depth 1 --branch master https://github.com/kivy/python-for-android.git /tmp/p4a
          for f in $(find /tmp/p4a/pythonforandroid/bootstraps -name AndroidManifest.tmpl.xml); do
            sed -i 's#</application>#    <receiver android:name="org.zistro.zistro.ReminderReceiver" android:exported="false" />\n    </application>#' "$f"
            echo "patched: $f"
            grep -n "ReminderReceiver" "$f"
          done
          
      - name: Build APK
        run: |
          set -o pipefail
          buildozer android debug 2>&1 | tee build.log

      - name: Find the real error
        if: failure()
        run: grep -n -E "ImportError|ModuleNotFoundError|sh.ErrorReturnCode|# Command failed|What went wrong|FAILURE:|BUILD FAILED" build.log | cut -c1-300 | tail -n 15

      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk

      - name: Diagnose manifest
        if: always()
        continue-on-error: true
        run: |
          D=.buildozer/android/platform/build-arm64-v8a/dists/zistro
          echo "=== generated manifest ==="
          sed -n '1,70p' $D/src/main/AndroidManifest.xml
          echo "=== p4a template ==="
          grep -rn "extra_manifest" .buildozer/android/platform/python-for-android/pythonforandroid/bootstraps --include="*.xml"

      - name: Verify receiver in manifest
        run: |
          D=.buildozer/android/platform/build-arm64-v8a/dists/zistro
          grep -n "ReminderReceiver" $D/src/main/AndroidManifest.xml
